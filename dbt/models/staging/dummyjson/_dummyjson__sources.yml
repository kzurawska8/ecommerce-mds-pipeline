sources:
  - name: dummyjson
    description: >
      Raw DummyJSON API data landed by the Python loader (src/ecommerce_mds_pipeline).
      Append-only: each run adds a full snapshot with its own _batch_id.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      # The loader runs daily; one missed run warns, two error.
      freshness:
        warn_after: {count: 26, period: hour}
        error_after: {count: 50, period: hour}
    tables:
      - name: products
        description: One row per product per batch. PAYLOAD is the API record as-is.
      - name: users
        description: >
          One row per user per batch. Contains fake personal data; the loader
          already drops passwords, staging selects only non-identifying fields.
      - name: carts
        description: One row per cart per batch, with line items nested in PAYLOAD:products.
